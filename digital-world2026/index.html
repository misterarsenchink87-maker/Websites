<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            overflow-x: hidden;
            background: linear-gradient(135deg,
            #000000 0%,
            #00110a 25%,
            #003b5c 55%,
            #00ff9d 75%,
            #000000 100%
);
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: Arial, Helvetica, sans-serif;
            color:white;
            opacity: 1;
            transition: opacity 0.5s ease;

        }
        body.fade-out {
            opacity: 0;
        }
        .block1 {
            display: flex;
            gap:10px;
            
             align-items: right;
            justify-content: right;
            font-size: 15pt;
            
        }
        
        .menu {
            display: flex;
            gap:20px;
             align-items: right;
            justify-content: right;
            font-size: 15pt;
            z-index: 1001;
        }
        .block2 {
            display: flex;
            gap: 18px;
            align-items: center;
            justify-content: center;
            
        }
        .block2 p {
            font-size: 15pt;

        }
        .block2 p:hover {
            transform: scale(1.05);
            transition: 0.5s;
            border-bottom: 1px solid black;
        }
        .block3 {
            position: relative;
            top:200px;
            text-align: center;
            display: block;
            gap:15px;
            font-size: 20pt;
        }
        .other_block {
            position: relative;
            left: 44%;
            top:80px;
            border: 1px solid white;
            border-radius: 8pt;
            width: 200px;
            height: 80px;
            
            
        }
        .other_block:hover {
            transform: scale(1.05);
            transition: 0.5s;
            border-bottom: 1px solid black;
        }
        .other_block2 h1 {
            color: rgb(7, 7, 186);
            
        }  
        .other_block2 span {
            color: transparent;
            -webkit-text-stroke: 2px rgb(215, 191, 11);
        }
        .reg {
            position: relative;
            left: 200px;
            background: rgb(27, 26, 26);
            width: 150px;
            height: 40px;
            border-radius: 8pt;
            text-align: center;
        }

        .reg label {
            position: relative;
            top:15px;
            color:transparent;
            -webkit-text-stroke: 1px white;
        }
        .reg:hover {
            transform: scale(1.05);
            transition: 0.3s;
            border-bottom: 1px solid white;
        }
        .conteiner {
            width: 1200px;
            margin: 0 auto;

        }
        .burger {
            display: none;
            width: 30px;
            height: 20px;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            z-index: 1001;

        }
        .overlay {
            position: fixed;
            top:0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.673);
            opacity: 0;
            pointer-events: none;
            display: none;
            transition: 0.3s ;
            z-index: 1000;
        }
        .overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        .size {
            margin: 0 auto;
        }
        @media (max-width:768px) {
            
            .conteiner {
                width: 100%;
                padding: 0 20px;
                font-size: 13pt;
            }
            .burger {
                display: flex;
            }
            .menu {
                position: fixed;
                top:0;
                right: -100%;
                width: 70%;
                height: 100vh;
                flex-direction: column;
                padding: 80px 20px;
                gap:20px;
                transition: 0.3s;
            }
            .menu.active {
                right: 0;
            }
            .overlay {
                display: block;
            }
            .overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        }
        @media (max-width:480px) {
            .conteiner {
                padding: 0 10px;
            }
             .burger {
                display: flex;
            }
            .menu {
                position: fixed;
                top:0;
                transform: translateX(100%);
                transition: transform 0.4s ease;
                width: 70%;
                height: 100vh;
                background: black;
                flex-direction: column;
                padding: 60px 20px;
                gap:20px;
                transition: 0.3s;
            }
            .menu.active {
                transform: translateX(0);
            }
            .overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        }
    </style>
</head>
<body>
    <div class="main">
    <header>
        <div class="block1">
            <label>EN</label>
            <label>RU</label>
        </div>
        <div class="block2 conteiner" >
            <div class="menu" id="menu">
            <p>NEWS</p>
            <p>AMBASSADORS</p>
            <p>TOOLS</p>
            <p>EDUCATION</p>
            <P>COMMUNITY</P>
            <P>FOR PARTNERS</P>
            <P>FOR MEMBERS</P>
            </div>
            <div class="burger" id="burger">Menu</div>
            <div class="overlay" id="overlay"></div>
            <div class="reg size">
                <label id="bth1">Sign Up</label>
            </div>
        </div>
    </header>
    <div class="block3 conteiner">
        <div class="other_block2">
            <h1 >Hello! <span id="title2"></span>,this is</h1>
            <h1>DIGITAL <span>WORLD</span> 2026</h1>
        </div>
        <div>
            <p>We are digitally empowering tecnology all over the world</p>
        </div>
        <div class="other_block">
            <p>Learn more</p>
        </div>
    </div>
    </div>
    <script>
        document.getElementById("bth1").addEventListener("click", () => {
            document.body.classList.add("fade-out")
            setTimeout(() => {
                window.location.href = "sign.html"
            },500)
        })
        const burger = document.getElementById("burger")
        const menu = document.getElementById("menu")
        const overlay = document.getElementById("overlay")
        burger.addEventListener("click" , () => {
            burger.classList.toggle("active")
            menu.classList.toggle("active")
            overlay.classList.toggle("active")
        })
        const nameUse = localStorage.getItem("username")
        if(nameUse) {
            document.getElementById("title2").textContent = nameUse
        }
    </script>
</body>
</html>
